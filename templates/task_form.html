{% extends 'base.html' %}{% block title %}Новая задача{% endblock %}{% block content %}<div class="page-head"><div><div class="eyebrow">ПОСТАНОВКА ЗАДАЧИ</div><h1>Создать задачу</h1><p class="muted">Заполните параметры и назначьте одного или нескольких исполнителей.</p></div><a class="btn secondary" href="{{ url_for('tasks') }}">← Назад</a></div><form class="panel form-panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><div class="field wide"><label>Наименование задачи *</label><input name="title" required maxlength="220" placeholder="Например: Разработать модуль отчётности"></div><div class="field wide"><label>Описание задачи *</label><textarea name="description" rows="4" required placeholder="Подробное содержание и требования"></textarea></div><div class="field wide"><label>Ожидаемый результат</label><textarea name="expected_result" rows="2" placeholder="Какой результат должен быть получен"></textarea></div><div class="field"><label>Департамент / отдел *</label><select name="section_id" required>{% for s in sections %}<option value="{{ s.id }}">{{ s.department.name }} / {{ s.name }}</option>{% endfor %}</select></div><div class="field"><label>Приоритет *</label><select name="priority">{% for p in PRIORITIES %}<option {{ 'selected' if p=='Средний' }}>{{ p }}</option>{% endfor %}</select></div><div class="field"><label>Дата начала *</label><input type="date" name="start_date" value="{{ today.isoformat() }}" required></div><div class="field"><label>Срок выполнения *</label><input type="date" name="due_date" value="{{ week_later.isoformat() }}" required></div><div class="field wide"><label>Исполнители * (можно выбрать нескольких)</label><select name="executor_ids" multiple size="5" required>{% for e in employees %}<option value="{{ e.id }}">{{ e.fullname }} — {{ e.section.name if e.section else 'Без отдела' }}</option>{% endfor %}</select><small class="muted">Удерживайте Ctrl (Windows), чтобы выбрать несколько сотрудников.</small></div></div><div class="form-actions"><a class="btn secondary" href="{{ url_for('tasks') }}">Отмена</a><button class="btn primary">Создать задачу</button></div></form>{% endblock %}
